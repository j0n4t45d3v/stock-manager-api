spring:
  application:
    name: stock-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/stock
    username: postgres
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 500ms
